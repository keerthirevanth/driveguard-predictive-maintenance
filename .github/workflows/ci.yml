name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml
      - name: Lint
        run: ruff check src tests
      - name: Unit tests (heavy tests self-skip via importorskip)
        run: pytest -q
        env:
          PYTHONPATH: src

  serving:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install serving deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serving.txt pytest
      - name: Serving + feature-vector tests
        run: pytest -q tests/test_serving.py tests/test_config.py
        env:
          PYTHONPATH: src
